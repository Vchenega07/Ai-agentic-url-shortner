name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode verify
      - name: HTTP end-to-end scenarios
        run: |
          java -jar target/agentic-url-shortener-0.1.0-SNAPSHOT.jar > /tmp/url-shortener.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/url-shortener.log; exit 1; fi
          python3 scripts/smoke.py --engineering
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Block vulnerable dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

